{% extends "base.html" %}

{% block content %}
<section class="container py-5">
  <h1>Connexion</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Se connecter</button>
    
    <p class="mt-3">
      Pas encore de compte ?
      <a href="{% url 'accounts:signup' %}">Créer un compte</a>
    </p>
  </form>
</section>
{% endblock %}
