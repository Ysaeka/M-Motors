{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}M Motors{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="{% static 'CSS/style.css' %}" />
  <link rel="stylesheet" href="{% static 'CSS/catalog.css' %}" />
  <link rel="stylesheet" href="{% static 'CSS/vehicle-detail.css' %}" />
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-4 px-lg-5">
      <a class="navbar-brand" href="/">
        <img src="{% static 'img/logo.png' %}" alt="M Motors" class="logo"/>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Ouvrir la navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <div class="ms-auto d-flex align-items-lg-center flex-column flex-lg-row gap-3 gap-lg-0">
          <a href="/" class="nav-link-custom">Accueil</a>
          <a href="/catalog/" class="nav-link-custom">Catalogue</a>
          <a href="/contact/" class="nav-link-custom">Contact</a>
          <a href="/login/" class="btn btn-client ms-lg-4">Espace client</a>
        </div>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <div class="container">
    <footer class="row row-cols-1 row-cols-sm-2 row-cols-md-4 py-5 my-5 border-top">
      <div class="col mb-3">
        <a href="/" class="d-flex align-items-center mb-3 link-body-emphasis text-decoration-none">
          <span class="fw-bold">M Motors</span>
        </a>
        <p class="text-body-secondary">M Motors © 2026</p>
      </div>

      <div class="col mb-3"></div>

      <div class="col mb-3">
        <h5>Navigation</h5>
        <ul class="nav flex-column">
          <li class="nav-item mb-2">
            <a href="/" class="nav-link p-0 text-body-secondary">Accueil</a>
          </li>
          <li class="nav-item mb-2">
            <a href="/catalog/" class="nav-link p-0 text-body-secondary">Catalogue</a>
          </li>
          <li class="nav-item mb-2">
            <a href="/contact/" class="nav-link p-0 text-body-secondary">Contact</a>
          </li>
        </ul>
      </div>

      <div class="col mb-3">
        <h5>Espace client</h5>
        <ul class="nav flex-column">
          <li class="nav-item mb-2">
            <a href="/login/" class="nav-link p-0 text-body-secondary">Connexion</a>
          </li>
          <li class="nav-item mb-2">
            <a href="/admin/" class="nav-link p-0 text-body-secondary">Administration</a>
          </li>
        </ul>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'JS/app.js' %}"></script>
</body>
</html>
