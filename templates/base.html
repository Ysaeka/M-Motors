{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}M Motors{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="{% static 'asset/CSS/style.css' %}" />
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-4 px-lg-5">
      <a class="navbar-brand" href="/">
        <img src="{% static 'asset/img/logo.png' %}" alt="M Motors" class="logo"/>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Ouvrir la navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <div class="ms-auto d-flex align-items-lg-center flex-column flex-lg-row gap-3 gap-lg-0">
          <a href="/" class="nav-link-custom">Accueil</a>
          <a href="/catalog/" class="nav-link-custom">Catalogue</a>
          <a href="/contact/" class="nav-link-custom">Contact</a>
          <a href="/login/" class="btn btn-client ms-lg-4">Espace client</a>
        </div>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
