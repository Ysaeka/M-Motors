<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M Motors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="../asset/css/style.css" />
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-4 px-lg-5">
      <a class="navbar-brand" href="#">
        <img src="../asset/img/logo.png" alt="M Motors" class="logo"/>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Ouvrir la navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <div class="ms-auto d-flex align-items-lg-center flex-column flex-lg-row gap-3 gap-lg-0">
          <a href="#" class="nav-link-custom">Accueil</a>
          <a href="catalog.html" class="nav-link-custom">Catalogue</a>
          <a href="contact.html" class="nav-link-custom">Contact</a>
          <a href="#" class="btn btn-client ms-lg-4">Espace client</a>
        </div>
      </div>
    </div>
  </nav>

  <section class="client-section">
    <div class="container-fluid px-4 px-lg-5">
        <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8 col-12">
            <div class="client-card">
            <p class="client-label">Espace client</p>
            <h1 class="client-title">Connexion</h1>
            <p class="client-text">
                Accédez à votre espace personnel pour suivre votre dossier,
                consulter vos informations et gérer vos demandes.
            </p>

            <form>
                <div class="mb-3">
                <label for="email" class="client-form-label">Adresse email</label>
                <input type="email" class="form-control client-input" id="email" placeholder="Votre adresse email">
                </div>

                <div class="mb-2">
                <label for="password" class="client-form-label">Mot de passe</label>
                <input type="password" class="form-control client-input" id="password" placeholder="Votre mot de passe">
                </div>

                <div class="client-links mb-4">
                <a href="#">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn client-login-btn w-100">Se connecter</button>
            </form>

            <div class="client-register">
                <span>Vous n’avez pas encore de compte ?</span>
                <a href="sign-in.html">Créer un compte</a>
            </div>
            </div>
        </div>
        </div>
    </div>
    </section>
</body>
